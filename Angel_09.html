<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Líneas y Bolas con Imágenes</title>
    <link rel="stylesheet" href="Angel_09.css">
</head>
<body>
    
    <div class="linea-negra">
        <p>Menu de libertec</p>
    </div>

    <div class="bolas">
        <div class="bola azul">
            <img src="jul.png" alt="Imagen 1">
        </div>
        <div class="bola amarilla">
            <img src="tec.png" alt="Imagen 2">
        </div>
        <div class="bola roja">
            <img src="jua.png" alt="Imagen 3">
        </div>
        <div class="bola azul">
            <img src="liber.png" alt="Imagen 4">
        </div>
    </div>

    <div class="linea-verde">
        <p>Llama para aprender</p>
    </div>

</body>
</html>
